name: spendime

services:
  postgres:
    image: postgres:16-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      APP_DB_USER: ${APP_DB_USER:?APP_DB_USER is required}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?APP_DB_PASSWORD is required}
      PGDATA: /var/lib/postgresql/data/pgdata
    command:
      - postgres
      - -c
      - shared_buffers=128MB
      - -c
      - effective_cache_size=256MB
      - -c
      - work_mem=4MB
      - -c
      - maintenance_work_mem=32MB
      - -c
      - max_connections=30
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init/001_schema.sql:/docker-entrypoint-initdb.d/001_schema.sql:ro
      - ./database/init/002_configure_app_role.sh:/docker-entrypoint-initdb.d/002_configure_app_role.sh:ro
      - ./database/init/003_financial_integrity.sql:/docker-entrypoint-initdb.d/003_financial_integrity.sql:ro
      - ./database/init/004_banking.sql:/docker-entrypoint-initdb.d/004_banking.sql:ro
      - ./database/init/005_banking_reconciliation.sql:/docker-entrypoint-initdb.d/005_banking_reconciliation.sql:ro
      - ./database/init/006_product_preferences.sql:/docker-entrypoint-initdb.d/006_product_preferences.sql:ro
    ports:
      - "${POSTGRES_BIND_ADDRESS:-127.0.0.1}:${POSTGRES_HOST_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    mem_limit: 512m
    mem_reservation: 256m
    cpus: 1.0
    pids_limit: 200
    stop_grace_period: 30s
    networks:
      - spendime_internal

  product-migrate:
    image: postgres:16-bookworm
    restart: "no"
    environment:
      PGHOST: postgres
      PGDATABASE: ${POSTGRES_DB:?POSTGRES_DB is required}
      PGUSER: ${POSTGRES_USER:?POSTGRES_USER is required}
      PGPASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    command: ["psql", "--no-psqlrc", "--set", "ON_ERROR_STOP=1", "--file", "/migrations/006_product_preferences.sql"]
    volumes:
      - ./database/init/006_product_preferences.sql:/migrations/006_product_preferences.sql:ro
    depends_on:
      postgres:
        condition: service_healthy
    mem_limit: 64m
    networks:
      - spendime_internal

  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    init: true
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      HOSTNAME: 0.0.0.0
      PORT: 3000
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      DB_POOL_MAX: ${DB_POOL_MAX:-10}
      SESSION_TTL_HOURS: ${SESSION_TTL_HOURS:-720}
      COOKIE_SECURE: ${COOKIE_SECURE:-auto}
      TRUST_PROXY: ${TRUST_PROXY:-0}
      APP_ORIGIN: ${APP_ORIGIN:-}
      AUTH_RATE_LIMIT_MAX: ${AUTH_RATE_LIMIT_MAX:-10}
      AUTH_RATE_LIMIT_WINDOW_MINUTES: ${AUTH_RATE_LIMIT_WINDOW_MINUTES:-15}
      BANKING_REDIRECT_URI: ${BANKING_REDIRECT_URI:-}
      ENABLE_BANKING_APP_ID: ${ENABLE_BANKING_APP_ID:-}
      ENABLE_BANKING_PRIVATE_KEY_FILE: ${ENABLE_BANKING_PRIVATE_KEY_FILE:-}
      ENABLE_BANKING_PRIVATE_KEY_B64: ${ENABLE_BANKING_PRIVATE_KEY_B64:-}
      BANKING_ENCRYPTION_KEY_B64: ${BANKING_ENCRYPTION_KEY_B64:-}
      BANKING_OWNER_USER_ID: ${BANKING_OWNER_USER_ID:-}
      BANKING_PRODUCTION_ENABLED: ${BANKING_PRODUCTION_ENABLED:-0}
      ENABLE_BANKING_PRODUCTION_APP_ID: ${ENABLE_BANKING_PRODUCTION_APP_ID:-}
      ENABLE_BANKING_PRODUCTION_PRIVATE_KEY_FILE: ${ENABLE_BANKING_PRODUCTION_PRIVATE_KEY_FILE:-}
      ENABLE_BANKING_PRODUCTION_PRIVATE_KEY_B64: ${ENABLE_BANKING_PRODUCTION_PRIVATE_KEY_B64:-}
      BANKING_PRODUCTION_ENCRYPTION_KEY_B64: ${BANKING_PRODUCTION_ENCRYPTION_KEY_B64:-}
      BANKING_PRODUCTION_REDIRECT_URI: ${BANKING_PRODUCTION_REDIRECT_URI:-}
      BANKING_PRODUCTION_WORKER_ENABLED: ${BANKING_PRODUCTION_WORKER_ENABLED:-0}
      BANKING_SANDBOX_SYNC_INTERVAL_MINUTES: ${BANKING_SANDBOX_SYNC_INTERVAL_MINUTES:-360}
      GEMINI_ENABLED: ${GEMINI_ENABLED:-0}
      GEMINI_PAID_PROJECT: ${GEMINI_PAID_PROJECT:-0}
      GEMINI_PRIVACY_APPROVED: ${GEMINI_PRIVACY_APPROVED:-0}
      GEMINI_MODEL: ${GEMINI_MODEL:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
    depends_on:
      product-migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
        restart: true
    ports:
      - "${APP_BIND_ADDRESS:-0.0.0.0}:${APP_PORT:-3000}:3000"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/health').then(r => { if (!r.ok) process.exit(1) }).catch(() => process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    mem_limit: 256m
    mem_reservation: 128m
    cpus: 0.75
    pids_limit: 100
    stop_grace_period: 15s
    networks:
      - spendime_internal

    volumes:
      - type: bind
        source: /home/ivko/.config/spendime/secrets/enable-banking-production.pem
        target: /run/secrets/enable-banking-production.pem
        read_only: true
        bind:
          create_host_path: false


  auth-test:
    profiles: ["test"]
    build:
      context: .
      dockerfile: Dockerfile
      target: test
    environment:
      NODE_ENV: test
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      TEST_DATABASE_URL: ${TEST_DATABASE_URL:-}
      DB_POOL_MAX: 3
      SESSION_TTL_HOURS: 1
      COOKIE_SECURE: never
      TRUST_PROXY: 0
      AUTH_RATE_LIMIT_MAX: 100
      AUTH_RATE_LIMIT_WINDOW_MINUTES: 1
    depends_on:
      postgres:
        condition: service_healthy
    mem_limit: 256m
    mem_reservation: 128m
    cpus: 1.0
    pids_limit: 100
    networks:
      - spendime_internal

  banking-worker:
    profiles: ["banking"]
    build:
      context: .
      dockerfile: Dockerfile
    command: ["node", "dist/src/banking-worker.js"]
    # A disabled worker exits successfully; do not restart that exit in a loop.
    restart: on-failure
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      DB_POOL_MAX: 3
      ENABLE_BANKING_APP_ID: ${ENABLE_BANKING_APP_ID:-}
      ENABLE_BANKING_PRIVATE_KEY_FILE: ${ENABLE_BANKING_PRIVATE_KEY_FILE:-}
      ENABLE_BANKING_PRIVATE_KEY_B64: ${ENABLE_BANKING_PRIVATE_KEY_B64:-}
      BANKING_ENCRYPTION_KEY_B64: ${BANKING_ENCRYPTION_KEY_B64:-}
      BANKING_OWNER_USER_ID: ${BANKING_OWNER_USER_ID:-}
      BANKING_PRODUCTION_ENABLED: ${BANKING_PRODUCTION_ENABLED:-0}
      ENABLE_BANKING_PRODUCTION_APP_ID: ${ENABLE_BANKING_PRODUCTION_APP_ID:-}
      ENABLE_BANKING_PRODUCTION_PRIVATE_KEY_FILE: ${ENABLE_BANKING_PRODUCTION_PRIVATE_KEY_FILE:-}
      ENABLE_BANKING_PRODUCTION_PRIVATE_KEY_B64: ${ENABLE_BANKING_PRODUCTION_PRIVATE_KEY_B64:-}
      BANKING_PRODUCTION_ENCRYPTION_KEY_B64: ${BANKING_PRODUCTION_ENCRYPTION_KEY_B64:-}
      BANKING_PRODUCTION_REDIRECT_URI: ${BANKING_PRODUCTION_REDIRECT_URI:-}
      BANKING_PRODUCTION_WORKER_ENABLED: ${BANKING_PRODUCTION_WORKER_ENABLED:-0}
      BANKING_SANDBOX_SYNC_INTERVAL_MINUTES: ${BANKING_SANDBOX_SYNC_INTERVAL_MINUTES:-360}
      GEMINI_ENABLED: ${GEMINI_ENABLED:-0}
      GEMINI_PAID_PROJECT: ${GEMINI_PAID_PROJECT:-0}
      GEMINI_PRIVACY_APPROVED: ${GEMINI_PRIVACY_APPROVED:-0}
      GEMINI_MODEL: ${GEMINI_MODEL:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy
    mem_limit: 128m
    networks:
      - spendime_internal

volumes:
  postgres_data:
    name: ${POSTGRES_VOLUME_NAME:-spendime_postgres_data}

networks:
  spendime_internal:
    name: ${SPENDIME_NETWORK_NAME:-spendime_internal}
    driver: bridge
